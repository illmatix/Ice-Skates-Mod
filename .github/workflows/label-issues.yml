name: Label Issues

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  label-issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue.title.toLowerCase();
            const body = (context.payload.issue.body || '').toLowerCase();
            const text = `${title} ${body}`;
            const labels = [];

            const rules = [
              { keywords: ['bug', 'crash', 'error', 'broken', 'fix'], label: 'bug' },
              { keywords: ['feature', 'add', 'new', 'implement', 'request'], label: 'feature' },
              { keywords: ['enhance', 'improve', 'update', 'upgrade'], label: 'enhancement' },
              { keywords: ['doc', 'readme', 'documentation', 'typo'], label: 'documentation' },
              { keywords: ['refactor', 'cleanup', 'restructure'], label: 'refactor' },
              { keywords: ['config', 'configuration', 'toggle', 'setting'], label: 'config' },
              { keywords: ['craft', 'recipe', 'anvil', 'smithing', 'grid recipe'], label: 'crafting' },
              { keywords: ['sharpen', 'whetstone', 'jig', 'repair', 'durability'], label: 'sharpening' },
              { keywords: ['skate', 'skating', 'ice detection', 'speed', 'hunger', 'particle'], label: 'skating' },
              { keywords: ['lining', 'lined', 'warmth', 'pelt', 'wool', 'linen'], label: 'lining' },
              { keywords: ['texture', 'shape', 'model', 'asset', 'lang'], label: 'assets' },
              { keywords: ['rink', 'creative', 'rink creator'], label: 'creative-tools' },
              { keywords: ['ci', 'workflow', 'build', 'csproj', 'dotnet'], label: 'chore' },
            ];

            for (const rule of rules) {
              if (rule.keywords.some(kw => text.includes(kw))) {
                labels.push(rule.label);
              }
            }

            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: labels,
              });
            }
